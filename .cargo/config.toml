# RUSTC_BOOTSTRAP allowlist — permits exactly the named crates to use
# `#![feature(...)]` and other unstable items on the stable toolchain.
# This is the Firefox pattern: contains "we use nightly features" to a
# small, audited set of crates so the rest of the workspace stays on
# strictly-stable Rust.
#
# - `allocate` wraps real `core::alloc::Allocator` + std types
#   (`Arc`, `Box`, `Vec`) and `hashbrown::HashMap` into stable
#   newtypes for the rest of the workspace.
# - `talc` and `hashbrown` use their own `nightly` features to impl
#   the real `core::alloc::Allocator` directly (verified upstream).
# - `foldhash` is hashbrown's default hasher; when hashbrown's
#   `nightly` feature propagates `foldhash?/nightly`, foldhash uses
#   `#![feature(hasher_prefixfree_extras)]` and needs bootstrap too.
#
# Anything not on this list compiles in strictly-stable mode.
[env]
RUSTC_BOOTSTRAP = "allocate,talc,hashbrown,foldhash"
