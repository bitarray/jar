[workspace]
resolver = "3"
members = [
    "tools/jar-genesis",
    "rust/build-crate",
    "rust/build-javm",
    "rust/nub-build",
    "rust/nub",
    "rust/nub-arch-x86",
    "rust/nub-arch-x86-abi",
    "rust/nub-host-kvm",
    "rust/nub-host-common",
    "rust/nub-host-guest-macro",
    "rust/nub-arch-local",
    "rust/nub-kernel",
    "rust/javm",
    "rust/subsoil",
    "rust/subsoil-derive",
    "rust/javm-guest-tests",
    "rust/javm-transpiler",
    "rust/ssz",
    "rust/ssz-derive",
    "rust/javm-cap",
    "rust/javm-exec",
    "rust/javm-recompiler-x86",
    "rust/javm-bench",
    "rust/jar-kernel",
    "rust/jar-test-services/halt",
    "components/benches/blake2b",
    "components/benches/ecrecover",
    "components/benches/ed25519",
    "components/benches/fri-fold-tree",
    "components/benches/goldilocks-mul",
    "components/benches/goldilocks-poseidon2",
    "components/benches/keccak",
    "components/benches/mini-verifier",
    "components/benches/poly-eval",
    "components/benches/poseidon2-perm",
    "components/benches/prime-sieve",
    "components/examples/simple-chain",
    "components/tests/spawn-child-s",
    "components/tests/spawn-parent-m",
]
exclude = [
    "spec/crypto-ffi",
    "spec/fuzz",
    # Vendored guest-bin (`#![no_std]` with its own panic_handler +
    # global_allocator). Only consumed by `nub-arch-x86` on
    # the `cfg(target_os = "none")` cross-compile; excluding it from
    # the workspace prevents `cargo build --workspace` (host target)
    # from trying to link a no_std panic_impl into a std world.
    "rust/nub-arch-guestbin",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
authors = [ "Bitarray GmbH <legal@bitarray.dev>" ]

[workspace.dependencies]
# Internal crates
javm = { path = "rust/javm" }
javm-exec = { path = "rust/javm-exec" }
javm-recompiler-x86 = { path = "rust/javm-recompiler-x86" }
javm-transpiler = { path = "rust/javm-transpiler" }
javm-cap = { path = "rust/javm-cap" }
jar-kernel = { path = "rust/jar-kernel" }
subsoil = { path = "rust/subsoil" }
subsoil-derive = { path = "rust/subsoil-derive" }
ssz = { path = "rust/ssz", default-features = false }
ssz-derive = { path = "rust/ssz-derive" }

# External dependencies
blake2 = "0.10"
sha3 = "0.10"
ed25519-dalek = { version = "2", features = ["rand_core"] }
rand = "0.8"
bip39 = "2.2.2"
thiserror = "2"
zeroize = { version = "1", features = ["derive"] }
hex = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
ark-vrf = { version = "0.2", features = ["bandersnatch", "ring"] }
blst = "0.3"
reed-solomon-simd = "3.1"
redb = "3.1"
tracing = "0.1"
tracing-test = "0.2"
proptest = "1"
tokio = { version = "1", features = ["full"] }
libp2p = { version = "0.56", features = ["gossipsub", "noise", "tcp", "yamux", "tokio", "macros", "identify", "request-response"] }
clap = { version = "4", features = ["derive"] }
futures = "0.3"
async-trait = "0.1"
jsonrpsee = { version = "0.24", features = ["server", "macros"] }


[profile.release]
lto = "thin"
codegen-units = 1

[profile.release.package.polkavm-linux-raw]
opt-level = 0
