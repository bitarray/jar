[package]
name = "bench-blake2b"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["lib", "cdylib"]

[dependencies]
blake2 = { version = "0.10", default-features = false }
nub-rt = { path = "../../nub-rt" }


[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(target_os, values("none"))'] }
