[package]
name = "bench-ecrecover"
version = "0.1.0"
edition = "2021"

[lib]
# A plain rlib. The kernel is a *library* consumed by the engine
# wrappers in `bench-compare/guests/*`, which are themselves the
# cdylibs. Listing `cdylib` here made the kernel a final artifact in its
# own right, and under the polkavm target (whose spec sets
# `only-cdylib`) that meant it had to supply a `#[global_allocator]` it
# has no business owning — which is exactly how it broke.
crate-type = ["lib"]

[dependencies]
# Pinned exactly. The `(return_value, gas)` vectors in nub-bench and
# javm-guest-tests are a function of the emitted instruction stream,
# so they depend on this crate's exact version as much as on rustc's
# (pinned in rust-toolchain.toml). A caret range let the standalone
# nub repo resolve a newer patch release and silently shift ed25519's
# gas by 3.3x. Bumping is fine — but it is a deliberate act that
# re-pins the vectors in the same commit.
k256 = { version = "=0.13.4", default-features = false, features = ["ecdsa"] }
nub-rt = { path = "../../nub-rt" }

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(target_os, values("none"))'] }
