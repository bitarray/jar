[package]
name = "bench-build"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false
description = "Fan each benchmark kernel out to every engine's artifact family"

[dependencies]
# nub's own PVM2 recipe, reused verbatim so the pvm2 artifacts are built
# with exactly the flags nub ships with. Anything else would make the
# comparison unfair in nub's favour or against it.
nub-build = { path = "../../nub-build" }
polkavm-linker = "0.36"
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
