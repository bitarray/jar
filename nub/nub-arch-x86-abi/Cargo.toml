[package]
name = "nub-arch-x86-abi"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Wire types shared between the nub-arch-x86 guest and its host driver, encoded with rkyv."

[features]
default = ["std"]
std = ["rkyv/std"]

[dependencies]
rkyv = { version = "0.8", default-features = false, features = ["alloc", "bytecheck"] }
bytecheck = { version = "0.8", default-features = false }
