name: Documentation

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

env:
  HUGO_VERSION: 0.159.0

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # -- Hugo + Hextra (main site) --
      - name: Install Hugo (extended)
        run: |
          curl -fsSL -o /tmp/hugo.deb \
            "https://github.com/gohugoio/hugo/releases/download/v${HUGO_VERSION}/hugo_extended_${HUGO_VERSION}_linux-amd64.deb"
          sudo dpkg -i /tmp/hugo.deb

      - uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      - name: Build Hugo site
        working-directory: docs
        run: hugo --minify --gc --destination ../site

      # -- JarBook (Lean spec, served at /lean/) --
      - name: Install elan
        run: |
          curl -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> $GITHUB_PATH

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Lake packages
        uses: actions/cache@v4
        with:
          path: spec/.lake
          key: lake-docs-${{ hashFiles('spec/lean-toolchain', 'spec/lake-manifest.json', 'spec/lakefile.lean') }}
          restore-keys: lake-docs-

      - name: Cache crypto-ffi build
        uses: actions/cache@v4
        with:
          path: spec/crypto-ffi/target
          key: crypto-ffi-docs-${{ hashFiles('spec/crypto-ffi/Cargo.toml', 'spec/crypto-ffi/Cargo.lock', 'spec/crypto-ffi/src/**') }}
          restore-keys: crypto-ffi-docs-

      - name: Build crypto-ffi
        working-directory: spec/crypto-ffi
        run: cargo build --release

      - name: Build JarBook
        working-directory: spec
        run: make book

      # -- Combine: JarBook served at /lean/ (the /spec/ path now hosts the minimum-v3 spec docs) --
      - name: Copy JarBook into site
        run: cp -r spec/_out/html-multi site/lean

      - uses: actions/upload-pages-artifact@v4
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/master'
        with:
          path: site

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/master'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v5
      - uses: actions/deploy-pages@v4
        id: deployment
