name: "CI: Rust"

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  audit:
    name: Security audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install cargo-audit
        run: cargo install cargo-audit --locked

      - name: cargo audit
        # Ignored advisories:
        #   RUSTSEC-2025-0009: ring 0.16.x AES panic — transitive dep via
        #     libp2p-tls -> rcgen -> ring. No upgrade path until libp2p
        #     updates to ring 0.17+.
        #   RUSTSEC-2025-0010: ring 0.16.x unmaintained — same root cause.
        run: >
          cargo audit
          --ignore RUSTSEC-2025-0009
          --ignore RUSTSEC-2025-0010

  sbom:
    name: SBOM
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Install cargo-cyclonedx
        run: cargo install cargo-cyclonedx --locked --version 0.5.9

      - name: Generate SBOMs
        run: >
          cargo cyclonedx
          --manifest-path Cargo.toml
          --format json
          --spec-version 1.5
          --override-filename sbom

      - name: Upload SBOM artifacts
        uses: actions/upload-artifact@v4
        with:
          name: rust-sbom
          if-no-files-found: error
          path: |
            nub/**/sbom.json
            rust/**/sbom.json
            components/**/sbom.json
            tools/**/sbom.json

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy, rust-src
          targets: x86_64-unknown-none

      - uses: Swatinem/rust-cache@v2

      - name: cargo fmt --check
        run: cargo fmt --all --check

      - name: cargo clippy
        run: cargo clippy --locked --workspace --all-targets -- -D warnings
        env:
          SKIP_GUEST_BUILD: 1

      - name: cargo doc
        run: cargo doc --locked --workspace --no-deps
        env:
          RUSTDOCFLAGS: "-D warnings"
          SKIP_GUEST_BUILD: 1

  test:
    name: Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rust-src
          targets: x86_64-unknown-none

      - uses: Swatinem/rust-cache@v2

      # nub-host-kvm uses /dev/kvm; standard ubuntu-latest runners
      # have nested-virt available but /dev/kvm is owned by `kvm`
      # group and not writable by the runner user. Install a udev
      # rule that makes the device world-rw.
      - name: Enable /dev/kvm access
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Workspace tests
        run: cargo test --locked --workspace --release
        env:
          RUSTFLAGS: "-D warnings"

  test-macos:
    # macOS only exercises the interpreter / spec-facing portion of
    # the workspace. The `nub` stack (KVM host + cross-compiled x86_64
    # guest binary) and `javm-recompiler-x86` are Linux-x86_64 only,
    # so we exclude them here. See ci-rust.yml comments for the
    # interpreter-only crate set.
    name: Tests (macOS, interpreter)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rust-src

      - uses: Swatinem/rust-cache@v2

      - name: Workspace tests (interpreter only)
        run: >
          cargo test --locked --workspace --release
          --exclude nub
          --exclude javm
          --exclude nub-host-kvm
          --exclude nub-host-common
          --exclude nub-host-guest-macro
          --exclude nub-kernel
          --exclude nub-arch-local
          --exclude nub-arch-x86
          --exclude nub-arch-x86-abi
          --exclude nub-build
          --exclude javm-recompiler-x86
        env:
          RUSTFLAGS: "-D warnings"
