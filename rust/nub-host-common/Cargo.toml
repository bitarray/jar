[package]
name = "nub-host-common"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Common types shared between the nub host (nub-host-kvm) and the in-sandbox guest (nub-arch-guestbin). Forked + stripped from hyperlight-common 0.15.0 (Apache-2.0): drops all FlatBuffers wrappers/codegen and the param-tuple polymorphism — those layers are replaced by rkyv-archived `rpc::{Request, Response}` envelopes."

[features]
default = ["tracing"]
std = ["thiserror/std", "log/std", "tracing/std"]
tracing = ["dep:tracing"]
trace_guest = []
guest-counter = []
mem_profile = []
i686-guest = []
nanvix-unstable = ["i686-guest"]

[dependencies]
allocator-api2 = { version = "0.4", default-features = false, features = ["alloc"] }
anyhow = { version = "1", default-features = false }
log = "0.4"
rkyv = { version = "0.8", default-features = false, features = ["alloc", "bytecheck"] }
bytecheck = { version = "0.8", default-features = false }
spin = "0.10"
# The state-cache allocator. We instantiate `TalcLock<RawSpinlock,
# Manual>` in shared memory at offset 0 of the cache region; both host
# and guest call into it under the same spinlock. The `allocator-api2`
# feature gives us an `Allocator` impl on `TalcLock`, so we can use
# `allocator_api2::vec::Vec<T, TalcAlloc>` / `Box<T, TalcAlloc>` for
# cap content.
spinning_top = "0.3"
# talc 5.x ships `allocator_api2::alloc::Allocator` impls unconditionally
# (the dep is non-optional inside talc), so we don't need to opt-in.
talc = { version = "5.0.3", default-features = false }
thiserror = { version = "2", default-features = false }
tracing = { version = "0.1", optional = true }
tracing-core = { version = "0.1", default-features = false }

[lints.rust]
unsafe_op_in_unsafe_fn = "deny"
