[package]
name = "javm-cap"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
description = "JAVM capability system: caps, cnode, image, SSZ hash"

[features]
default = ["std"]
std = ["ssz/std", "blake2/std", "thiserror/std", "rkyv/std"]

[dependencies]
hashbrown = { version = "0.17", default-features = false, features = ["default-hasher", "inline-more"] }
blake2 = { version = "0.10", default-features = false }
thiserror = { version = "2", default-features = false }
ssz = { workspace = true, features = ["sha2", "derive"] }
ssz-derive = { workspace = true }
# Wire-form rkyv derives live in `wire.rs`. The cap types proper still
# move through SSZ for hash-tree-root computation; rkyv is only used
# for the host→guest `put_cap` RPC payload.
rkyv = { version = "0.8", default-features = false, features = ["alloc", "bytecheck"] }
# Interior-mutable directory lock. spin (vs std::sync::Mutex) so the
# guest build (`target_os = "none"`) keeps working without std.
spin = "0.10"
