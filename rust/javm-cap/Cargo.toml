[package]
name = "javm-cap"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
description = "JAVM capability system: caps, cnode, image, SSZ hash"

[features]
default = ["std"]
std = ["ssz/std", "blake2/std", "thiserror/std", "rkyv/std"]

[dependencies]
# PVM2 address-space ABI constants, re-exported by `layout`. no_std with
# zero deps, so the guest build picks it up for free.
nub-program = { path = "../../nub/nub-program" }
hashbrown = { version = "0.17", default-features = false, features = ["default-hasher", "inline-more"] }
blake2 = { version = "0.10", default-features = false }
thiserror = { version = "2", default-features = false }
ssz = { workspace = true, features = ["sha2", "derive"] }
ssz-derive = { workspace = true }
# The cap types derive rkyv inline (`Cap` is itself the wire form);
# rkyv is only used for the host→guest `put_cap` RPC payload. The types
# still move through SSZ for hash-tree-root computation. `smallvec-1`
# enables rkyv's `SmallVec` impls (archived as a plain `ArchivedVec`) so
# `SlotKey`/`SlotPath` derive rkyv. Enabled unconditionally (not behind a
# feature) so guest-side cap consumers (`nub-arch-x86`) get it too.
rkyv = { version = "0.8", default-features = false, features = ["alloc", "bytecheck", "smallvec-1"] }
# Inline-then-spill storage for `SlotKey`/`SlotPath` (short byte keys /
# shallow paths stay inline). no_std (default-features off) for the guest
# build; SSZ wire/hash form matches `Vec` (see `ssz::smallvec_impl`).
smallvec = { version = "1", default-features = false, features = ["const_generics"] }
# Interior-mutable directory lock. spin (vs std::sync::Mutex) so the
# guest build (`target_os = "none"`) keeps working without std.
spin = "0.10"
