[package]
name = "javm-cap"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
description = "JAVM capability system: caps, cnode, image, SSZ hash"

[features]
default = ["std"]
std = ["ssz/std", "blake2/std", "thiserror/std"]

[dependencies]
allocator-api2 = { version = "0.4", default-features = false, features = ["alloc"] }
blake2 = { version = "0.10", default-features = false }
thiserror = { version = "2", default-features = false }
ssz = { workspace = true, features = ["sha2", "derive"] }
ssz-derive = { workspace = true }
nub-host-common = { path = "../nub-host-common", default-features = false }
nub-talc-util = { path = "../nub-talc-util" }

[dev-dependencies]
talc = { version = "5.0.3", default-features = false }
