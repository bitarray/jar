[package]
name = "build-javm"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "build.rs helper: compile a Rust crate to a SCALE-encoded JAVM Cap::Image blob"

[dependencies]
build-crate = { path = "../build-crate" }
javm-transpiler = { path = "../javm-transpiler" }
ssz = { workspace = true, features = ["std", "sha2", "derive"] }
