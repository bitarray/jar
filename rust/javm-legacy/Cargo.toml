[package]
name = "javm-legacy"
version = "0.4.0"
edition.workspace = true
license.workspace = true
authors.workspace = true
description = "Legacy (v2) JAVM — preserved as a cherry-pick reference while the v3 javm integration crate is built. Frozen API; new code targets the v3 javm crate."

[features]
default = ["std"]
std = ["libc", "memoffset", "blake2"]

[dependencies]
blake2 = { workspace = true, optional = true }
libc = { version = "0.2", optional = true }
memoffset = { version = "0.9", optional = true }
scale = { workspace = true, default-features = false }
thiserror = { workspace = true }
tracing = { workspace = true }

[dev-dependencies]
proptest = { workspace = true }
