[package]
name = "nub-arch-hyperlight-abi"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Wire types shared between the nub-arch-hyperlight guest and its host driver (SCALE-encoded InvocationSpec / InvocationResult)."

[features]
default = ["std"]
std = ["scale/std"]

[dependencies]
scale = { path = "../scale", default-features = false }
scale-derive = { workspace = true }
