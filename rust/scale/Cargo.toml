[package]
name = "scale"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "SCALE codec without compact encoding. Fixed-width LE integers, u32 count-prefixed arrays."

[features]
default = ["std"]
std = ["thiserror/std"]

[dependencies]
# Direct dep with `default-features = false` so we can switch
# thiserror on/off via the `std` feature for no_std consumers.
thiserror = { version = "2", default-features = false }
scale-derive = { workspace = true }

[dev-dependencies]
proptest = { workspace = true }
