[package]
name = "javm-guest-tests"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["lib"]

[dependencies]
nub-rt = { workspace = true }
blake2 = { version = "0.10", default-features = false }
sha3 = { version = "0.10", default-features = false }

[build-dependencies]
build-javm = { path = "../build-javm" }

[dev-dependencies]
javm-cap = { workspace = true }
ssz = { workspace = true, features = ["std", "sha2", "derive"] }

[target.'cfg(all(target_os = "linux", target_arch = "x86_64"))'.dev-dependencies]
javm = { path = "../javm" }

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(target_os, values("none"))'] }
