[package]
name = "allocate"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Single source of allocator-aware Box, Vec, Arc, HashMap + TalcAlloc. The only crate that uses RUSTC_BOOTSTRAP — wraps std's nightly-only allocator-aware types into stable newtypes for the rest of the workspace."

[dependencies]
hashbrown = { version = "0.17", default-features = false, features = ["nightly", "default-hasher", "inline-more", "equivalent"] }
spinning_top = "0.3"
talc = { version = "5.0.3", default-features = false, features = ["nightly"] }

[lints.rust]
unsafe_op_in_unsafe_fn = "deny"
