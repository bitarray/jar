[package]
name = "javm-guest-x86"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "JAVM guest personality for the nub bare-metal kernel: javm-cap state/cap system + production guest binaries"

[lib]
name = "javm_guest_x86"
path = "src/lib.rs"

[[bin]]
name = "javm-guest-x86"
path = "src/main.rs"

[[bin]]
name = "javm-guest-x86-tests"
path = "src/bin/tests.rs"

[[bin]]
name = "javm-guest-x86-benches"
path = "src/bin/benches.rs"

# Guest deps only on the bare-metal target (same pattern + rationale as
# nub-arch-x86: on the host target this crate compiles to trivial empty
# `main`s so it can be part of `cargo build --workspace`).
[target.'cfg(target_os = "none")'.dependencies]
# REQUIRED DIRECT + UNRENAMED: `register_guest_kernel!` expands
# `hyperlight_guest_bin::guest_function` attrs whose proc macro resolves the
# crate via proc_macro_crate::crate_name("hyperlight-guest-bin") AT THE
# INVOKING CRATE. No `package =` alias.
hyperlight-guest-bin = { path = "../../nub/nub-arch-guestbin", default-features = false }
# The generic guest-kernel lib (personality/task/guest_fns/jit_run/paging/...).
nub-arch-x86 = { path = "../../nub/nub-arch-x86", default-features = false }
javm-cap = { path = "../javm-cap", default-features = false }
javm-exec = { path = "../javm-exec", default-features = false }
javm-recompiler-x86 = { path = "../javm-recompiler-x86", default-features = false }
nub-arch-x86-abi = { path = "../../nub/nub-arch-x86-abi", default-features = false }
nub-host-common = { path = "../../nub/nub-host-common", default-features = false }
rkyv = { version = "0.8", default-features = false, features = ["alloc", "bytecheck"] }
spin = "0.10"
foldhash = { version = "0.2", default-features = false }

[features]
default = []
# Forwards through the generic lib (whose own heap-diag gates
# nub_heap_stats_impl and forwards to hyperlight-guest-bin/heap-diag).
# The macro-stamped nub_heap_stats wrapper's `#[cfg(feature = "heap-diag")]`
# resolves against THIS crate, so this feature must exist here.
heap-diag = ["nub-arch-x86/heap-diag"]

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(hyperlight)'] }
