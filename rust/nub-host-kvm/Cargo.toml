# Vendored from hyperlight-host 0.15.0 (Apache-2.0).
# Stage F.2.1: dropped MSHV + WHP + Windows surrogate. KVM is the only
# supported hypervisor backend now.

[package]
name = "nub-host-kvm"
version.workspace = true
edition = "2024"
rust-version = "1.89"
license.workspace = true
description = "Forked Hyperlight host (KVM-only) — micro-VM host driver for nub."

[lib]
name = "nub_host_kvm"
path = "src/lib.rs"

[features]
default = ["kvm"]
executable_heap = []
function_call_metrics = []
hw-interrupts = []
kvm = [
    "dep:kvm-bindings",
    "dep:kvm-ioctls",
]
print_debug = []

[dependencies]
anyhow = "1.0"
bitflags = "2.11.1"
blake3 = "1.8.5"
cfg-if = "1.0.4"
crossbeam-channel = "0.5.15"
flatbuffers = "25.12.19"
goblin = { version = "0.10", default-features = false, features = ["std", "elf32", "elf64", "endian_fd"] }
hyperlight-common = { version = "0.15.0", features = ["std"] }
nub-host-common = { path = "../nub-host-common", features = ["std"] }
libc = "0.2.186"
log = "0.4.29"
metrics = "0.24.5"
page_size = "0.6.0"
rand = "0.10"
serde_json = "1.0"
termcolor = "1.2.0"
thiserror = { workspace = true, features = ["std"] }
tracing = { version = "0.1.44", features = ["log"] }
tracing-core = "0.1.36"
tracing-log = "0.2.0"
uuid = { version = "1.23.1", features = ["v4"] }
vmm-sys-util = "0.15.0"

[target."cfg(unix)".dependencies]
kvm-bindings = { version = "0.14", features = ["fam-wrappers"], optional = true }
kvm-ioctls = { version = "0.24", optional = true }

[build-dependencies]
anyhow = "1.0.102"
cfg_aliases = "0.2.1"

[lints.rust]
unsafe_op_in_unsafe_fn = "deny"
# Residual cfg gates left after F2.1 (mshv3) and F2.2 (gdb, crashdump,
# trace_guest, mem_profile, i686-guest, nanvix-unstable, fuzzing). The
# alias / feature is gone so the gates are always-false. They'll get
# stripped opportunistically as later stages touch each file.
unexpected_cfgs = { level = "allow", check-cfg = [
    'cfg(mshv3)',
    'cfg(gdb)',
    'cfg(crashdump)',
    'cfg(unshared_snapshot_mem)',
] }

# Allow upstream-style code patterns that newer clippy flags but we
# don't want to diverge from upstream over. Re-evaluate periodically.
[lints.clippy]
while_let_loop = "allow"
