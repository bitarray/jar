# Vendored from hyperlight-guest-bin 0.15.0 (Apache-2.0).
# Stage F.1: byte-for-byte copy, no behavior changes. Subsequent stages
# strip aarch64/libc/logger/mem_profile, drop the CoW pagefault handler,
# and swap the buddy heap allocator for talc.
#
# The directory lives at `rust/nub-arch-guestbin/` for workspace clarity,
# but `package.name` is `hyperlight-guest-bin` so `proc_macro_crate`
# (used by `hyperlight-guest-macro`'s `#[guest_function]`) resolves it
# by the upstream crate name. Our workspace doesn't depend on the
# real upstream `hyperlight-guest-bin` anywhere else, so there's no
# duplicate-crate conflict.

[package]
name = "hyperlight-guest-bin"
# Version locked to upstream 0.15.0 because `hyperlight-host`'s ELF
# load-time ABI check compares the `.note.hyperlight-version` against
# its own crate version. We'll relax this once `nub` switches over to
# `nub-host-x86` (which will drop the check) in Stage F4.
version = "0.15.0"
edition = "2024"
rust-version = "1.89"
license = "Apache-2.0"
description = "Forked Hyperlight guest-bin (x86_64-only) — guest-side init + panic handler + exception entry for nub."

[features]
default = ["macros"]
macros = [
    "dep:hyperlight-guest-macro",
    "dep:linkme",
]

[lib]
name = "hyperlight_guest_bin"
path = "src/lib.rs"

[dependencies]
flatbuffers = { version = "25.12.19", default-features = false }
hyperlight-common = { version = "0.15.0", default-features = false }
hyperlight-guest = { version = "0.15.0", default-features = false }
hyperlight-guest-macro = { version = "0.15.0", optional = true, default-features = false }
linkme = { version = "0.3.36", optional = true }
spin = "0.10.0"
spinning_top = "0.3.0"
talc = "5.0.3"
tracing = { version = "0.1.44", features = ["attributes"], default-features = false }

[lints.rust]
unsafe_op_in_unsafe_fn = "deny"
