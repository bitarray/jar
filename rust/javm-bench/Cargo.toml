[package]
name = "javm-bench"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "JAVM v3 benchmarks: byte-PVM interpreter vs JIT recompiler."

[features]
default = []
# Pull in `nub/heap-diag` for the `tests/heap_drift.rs` regression
# check. Off by default; opt in with `cargo test -p javm-bench
# --test heap_drift --features heap-diag -- --ignored --nocapture`.
heap-diag = ["nub/heap-diag"]

[dependencies]
allocator-api2 = "0.4"
javm-cap = { workspace = true }
javm-exec = { workspace = true }
sha2 = "0.10"
ssz = { workspace = true, features = ["std", "sha2", "derive"] }

[target.'cfg(all(target_os = "linux", target_arch = "x86_64"))'.dependencies]
nub = { path = "../nub" }
nub-arch-x86-abi = { path = "../nub-arch-x86-abi" }
blake3 = "1"

[build-dependencies]
build-javm = { path = "../build-javm" }

[dev-dependencies]
criterion = "0.5"

[[bench]]
name = "pvm_bench"
harness = false

[[bench]]
name = "stark_bench"
harness = false

[[example]]
name = "publish_profile"
path = "examples/publish_profile.rs"
