[package]
name = "javm-bench"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "JAVM v3 benchmarks: PVM2 (RISC-V) interpreter vs JIT recompiler."

[features]
default = []
# Pull in `javm/heap-diag` for the `tests/heap_drift.rs` regression
# check. Off by default; opt in with `cargo test -p javm-bench
# --test heap_drift --features heap-diag -- --ignored --nocapture`.
heap-diag = ["javm/heap-diag"]

[dependencies]
javm-cap = { workspace = true }
javm-exec = { workspace = true }
sha2 = "0.10"
ssz = { workspace = true, features = ["std", "sha2", "derive"] }

[target.'cfg(all(target_os = "linux", target_arch = "x86_64"))'.dependencies]
javm = { path = "../javm" }
nub-arch-x86-abi = { path = "../nub-arch-x86-abi" }
javm-recompiler-x86 = { path = "../javm-recompiler-x86" }
blake3 = "1"
# `javm-bench` is a benchmark crate: criterion is a normal (not dev)
# dependency so the shared criterion drivers can live in `src/lib.rs`.
# Scoped to the target the bench harness actually compiles on.
criterion = "0.5"

[build-dependencies]
build-javm = { path = "../build-javm" }

[[bench]]
name = "bench"
harness = false

[[bench]]
name = "sub_vm_recurse"
harness = false

[[bench]]
name = "sub_vm_data_recurse"
harness = false

[[bench]]
name = "pt_cache_call"
harness = false

