[package]
name = "javm-bench"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "JAVM v3 benchmarks: byte-PVM interpreter vs JIT recompiler."

[dependencies]
javm-cap = { workspace = true }
jar-kernel = { workspace = true }
javm-exec = { workspace = true }
scale = { workspace = true, features = ["std"] }

[target.'cfg(all(target_os = "linux", target_arch = "x86_64"))'.dependencies]
nub = { path = "../nub" }

[build-dependencies]
build-javm = { path = "../build-javm" }

[dev-dependencies]
criterion = "0.5"

[[bench]]
name = "pvm_bench"
harness = false
