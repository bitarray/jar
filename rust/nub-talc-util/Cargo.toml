[package]
name = "nub-talc-util"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Memory primitives for a talc-backed shared region: Aarc<T, A>, TalcAlloc, TalcBox, TalcSlice."

[dependencies]
allocator-api2 = { version = "0.4", default-features = false, features = ["alloc"] }
spinning_top = "0.3"
talc = { version = "5.0.3", default-features = false }

[lints.rust]
unsafe_op_in_unsafe_fn = "deny"
