baseURL: https://jarchain.org/
title: JAR Chain
languageCode: en-us

enableRobotsTXT: true
enableGitInfo: false
enableEmoji: true

module:
  imports:
    - path: github.com/imfing/hextra

markup:
  goldmark:
    renderer:
      unsafe: true
  highlight:
    noClasses: false

params:
  description: "JAR Chain: Join-Accumulate Refine blockchain based on JAM."
  navbar:
    displayTitle: true
    displayLogo: false
  page:
    width: normal
  theme:
    default: system
    displayToggle: true
  search:
    enable: true
    type: flexsearch
    flexsearch:
      index: content
  editURL:
    enable: true
    base: "https://github.com/jarchain/jar/edit/master/website/content"
  footer:
    enable: true
    displayCopyright: true
    displayPoweredBy: false
  toc:
    displayTags: true

menu:
  main:
    - identifier: docs
      name: Documentation
      url: /introduction/
      weight: 1
    - identifier: spec
      name: Specification
      pageRef: /spec
      weight: 2
    - identifier: lean
      name: Lean Book
      url: /lean/
      weight: 3
    - identifier: matrix
      name: Matrix
      url: https://matrix.to/#/#jar:matrix.org
      weight: 4
    - identifier: github
      name: GitHub
      url: https://github.com/jarchain/jar
      weight: 5
      params:
        icon: github

  sidebar:
    - identifier: more
      name: More
      params:
        type: separator
      weight: 100
    - identifier: matrix
      name: "Matrix ↗"
      url: https://matrix.to/#/#jar:matrix.org
      weight: 101

services:
  googleAnalytics:
    ID:
